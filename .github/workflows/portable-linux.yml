name: Build portable upstream receiver
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portable-linux.yml'
      - 'portable_linux/build-guest.sh'
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gnss-sdr/gnss-sdr
          ref: 3132713b88a1b5b2ee8291bff8076574749349de
          path: upstream
          persist-credentials: false
      - name: Build receiver and guest runtime
        run: bash portable_linux/build-guest.sh
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-linux-x86_64
          path: guest-output/
          compression-level: 0
          if-no-files-found: error
