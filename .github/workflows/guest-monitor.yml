name: Build guest monitor bridge
on:
  workflow_dispatch:
  push:
    paths:
      - 'portable_linux/monitor_relay.c'
      - '.github/workflows/guest-monitor.yml'
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cc -std=c11 -O2 -Wall -Wextra -Werror portable_linux/monitor_relay.c -o monitor-relay
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-monitor-relay
          path: monitor-relay
